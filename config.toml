# Aube — configuration de la phase 1 (collecte et archive)
# Toute modification de ce fichier change son hash, consigné dans chaque manifeste.

[general]
# Relatif à la racine du projet (dossier contenant ce fichier).
data_dir = "data"
# arXiv et INSPIRE demandent un User-Agent identifiable avec un contact.
# Mets ton adresse dans config.local.toml (non versionné), pas ici.
user_agent = "aube/0.1 (veille locale personnelle)"
timeout_s = 60
max_bytes = 50_000_000   # garde-fou : une réponse plus grosse est refusée
retries = 4

[arxiv]
categories = ["hep-ex", "hep-ph", "hep-th", "cond-mat.supr-con"]
# Collecte par OAI-PMH (https://oaipmh.arxiv.org/oai, arXivRaw) : l'API Atom ne sait pas
# filtrer par date de mise à jour (voir aube/sources/arxiv.py). Sets vérifiés par ListSets
# le 2026-10-04 ; chaque set inclut les cross-lists.
sets = { "hep-ex" = "physics:hep-ex", "hep-ph" = "physics:hep-ph", "hep-th" = "physics:hep-th", "cond-mat.supr-con" = "physics:cond-mat:supr-con" }
# Fenêtre : jours de datestamp clos, de (dernier succès − overlap_days) à hier UTC inclus,
# interrogés un jour à la fois (voir Run._oai_day). Doublons absorbés par l'index (id+version).
overlap_days = 3
delay_s = 3.5            # arXiv demande >= 3 s entre requêtes

[arxiv_witness]
# Flux RSS quotidien d'arXiv, utilisé UNIQUEMENT comme témoin indépendant :
# l'audit vérifie que tout ce qu'il annonce se retrouve dans l'archive API.
enabled = true

[cern]
# Flux WordPress de home.cern (annoncé par <link rel="alternate"> sur https://home.cern/news).
# L'ancienne URL /api/news/news/feed.rss renvoie 404 (constaté le 2026-10-04).
# 10 items par page ; jusqu'à 7 items entre deux runs observés sur 3 semaines : la page 2
# donne de la marge si un run saute. Ne pas ajouter /fr/feed/ : les traductions ont
# d'autres guid et d'autres liens, elles seraient comptées deux fois.
feeds = ["https://home.cern/feed/", "https://home.cern/feed/?paged=2"]

[inspire]
enabled = true
# {since} et {until} sont remplacés par des dates AAAA-MM-JJ (UTC).
# until = hier : la fenêtre est close, son total ne bouge plus pendant la pagination.
# `da` = date-added = _created (date d'entrée dans INSPIRE, pas de publication), jours entiers
# bornes incluses (vérifié le 2026-10-04 : `da 2026-10-01` = 524 = les `created` du 1er dans
# les blobs). `date-added` en toutes lettres renvoie HTTP 400 ; `du` (date de mise à jour)
# ramène les anciens enregistrements modifiés (4930 contre 1480 sur la même fenêtre).
query = "da >= {since} and da <= {until}"
overlap_days = 3
# Rattrapage après panne par tranches de 14 jours : ~570 entrées/jour au plus observées,
# MAX_DEPTH = 10 000.
max_window_days = 14
page_size = 250
delay_s = 1.0
fields = "control_number,titles.title,abstracts.value,arxiv_eprints,authors.full_name,inspire_categories,document_type,publication_info,citation_count,references.record,created,updated,earliest_date"
# earliest_date : clé du tri « mostrecent » (-earliest_date, control_number), archivée pour
# pouvoir vérifier l'ordre de pagination a posteriori.
